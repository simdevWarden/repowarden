# Action GitHub : mêmes règles que les hooks repowarden, en CI (non contournable).
#
#   - uses: actions/checkout@v4
#     with:
#       fetch-depth: 0
#   - uses: simdevWarden/repowarden@v4
name: repowarden
description: Vérifie messages de commit, nom de branche, secrets, formatage et tests des projets touchés ; linters via MegaLinter en option.
author: SimBienvenueHoulBoumi

inputs:
  checks:
    description: Vérifications à lancer (commits branch secrets format tests deadcode comments)
    default: commits branch secrets format tests deadcode comments
  strict:
    description: "true : un outil de formatage/test manquant fait échouer"
    default: "false"
  gitleaks-version:
    description: Version de gitleaks installée pour la vérification des secrets
    default: 8.30.1
  actionlint-version:
    description: Version d'actionlint installée pour vérifier les workflows du projet
    default: 1.7.12
  fix-pr:
    description: >-
      "true" : sur une PR, recible une PR mal visée (flux integrationBranch, ou
      ferme un doublon) et remplace un titre non conforme, avant de vérifier.
      Demande « permissions: pull-requests: write ». Ignoré pour les PR de forks.
    default: "false"
  megalinter:
    description: "true : lance aussi MegaLinter (linters de ~50 langages, fichiers modifiés). Linux uniquement."
    default: "false"

runs:
  using: composite
  steps:
    - name: Installer gitleaks
      if: contains(inputs.checks, 'secrets')
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
        REPOWARDEN_BIN: ${{ runner.temp }}/repowarden-bin
      run: bash "$GITHUB_ACTION_PATH/ci/install-tool.sh" gitleaks

    # Les workflows du projet sont vérifiés par actionlint (étape tests)
    - name: Installer actionlint
      if: contains(inputs.checks, 'tests') && hashFiles('.github/workflows/*.yml', '.github/workflows/*.yaml') != ''
      shell: bash
      env:
        ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
        REPOWARDEN_BIN: ${{ runner.temp }}/repowarden-bin
      run: bash "$GITHUB_ACTION_PATH/ci/install-tool.sh" actionlint

    - name: Correction de la PR (cible, titre)
      if: >-
        inputs.fix-pr == 'true' && github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        HEAD: ${{ github.event.pull_request.head.ref }}
        BASE: ${{ github.event.pull_request.base.ref }}
        TITLE: ${{ github.event.pull_request.title }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        FORCE_COLOR: "1" # charte visuelle dans les logs
      run: bash "$GITHUB_ACTION_PATH/ci/fix-pr.sh"

    # Code mort Java : PMD (empreinte figée), seulement pour un projet Maven ou Gradle
    - name: Installer PMD
      if: contains(inputs.checks, 'deadcode') && hashFiles('**/pom.xml', '**/build.gradle', '**/build.gradle.kts') != ''
      shell: bash
      env:
        REPOWARDEN_BIN: ${{ runner.temp }}/repowarden-bin
      run: bash "$GITHUB_ACTION_PATH/ci/install-tool.sh" pmd

    - name: Vérifications repowarden
      if: env.REPOWARDEN_PR_CLOSED != 'true'
      shell: bash
      env:
        REPOWARDEN_CHECKS: ${{ inputs.checks }}
        REPOWARDEN_STRICT: ${{ inputs.strict }}
        REPOWARDEN_BIN: ${{ runner.temp }}/repowarden-bin
        GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        # Valeurs corrigées par l'étape précédente (fix-pr), sinon celles de la PR
        REPOWARDEN_PR_TITLE: ${{ env.REPOWARDEN_FIXED_TITLE || github.event.pull_request.title }}
        REPOWARDEN_PR_BODY: ${{ github.event.pull_request.body }}
        REPOWARDEN_TARGET: ${{ env.REPOWARDEN_FIXED_TARGET }}
        REPOWARDEN_BASE: ${{ env.REPOWARDEN_FIXED_BASE }}
        GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        FORCE_COLOR: "1" # charte visuelle dans les logs
      run: bash "$GITHUB_ACTION_PATH/ci/check.sh"

    # Linters : délégués à MegaLinter plutôt que réimplémentés. Configuration
    # éventuelle dans le .mega-linter.yml du projet.
    - name: MegaLinter
      if: inputs.megalinter == 'true'
      uses: oxsecurity/megalinter@9949bad031045f366be2467e00e8371a7328a2e2 # v10.1.0
      env:
        VALIDATE_ALL_CODEBASE: "false"
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        GITHUB_TOKEN: ${{ github.token }}
