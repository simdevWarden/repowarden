# Suivi des tickets, réutilisable par tout projet (sans clé ni jeton) :
#
#   on:
#     pull_request_target:
#       types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft, closed]
#     pull_request_review:
#       types: [submitted]
#     issues:
#       types: [opened, labeled, assigned, closed]
#     push:
#       branches-ignore: [main, master, develop]
#   jobs:
#     tickets:
#       uses: simdevWarden/repowarden/.github/workflows/tickets.yml@v4
#       permissions: { contents: write, issues: write, pull-requests: write, statuses: write }
#
# et, dans release.yml, après une release, une préversion ou une livraison
# sans nouvelle version :
#
#     tickets:
#       needs: release
#       if: needs.release.outputs.release_created == 'true' || needs.release.outputs.prerelease_created == 'true' || needs.release.outputs.delivered_without_version != ''
#       uses: simdevWarden/repowarden/.github/workflows/tickets.yml@v4
#       permissions: { contents: write, issues: write, pull-requests: write, statuses: write }
#       with:
#         tag: ${{ needs.release.outputs.tag_name || needs.release.outputs.prerelease_tag }}
#         delivered-sha: ${{ needs.release.outputs.delivered_without_version }}
#
# Le ticket d'abord, la branche en découle : à la validation (étiquette
# « validé »), la branche type/12-titre est créée depuis la branche
# d'intégration et liée au ticket ; le premier push ouvre la PR en brouillon.
# Chaque PR doit citer un ticket validé (« Ticket : #12 », ou branche feat/12-…),
# sinon le ticket est créé « à valider » et la vérification « ticket » échoue
# jusqu'à ce qu'un mainteneur pose l'étiquette « validé ». Statuts suivis :
# à valider → backlog → en cours → en relecture → préprod → done.
# pull_request_target : aucun code de la PR n'est récupéré ni exécuté (API seule),
# les PR venant de forks peuvent donc être traitées en sécurité.
name: tickets

on:
  workflow_call:
    inputs:
      tag:
        description: Release ou préversion publiée (vX.Y.Z, vX.Y.Z-next.N) ; vide hors release
        type: string
        default: ""
      delivered-sha:
        description: "Commit livré sur la branche principale sans nouvelle version (sortie delivered_without_version de release-auto) : tickets en préprod passés en done et fermés"
        type: string
        default: ""
      integration-branch:
        description: Branche d'intégration (ses PR de livraison n'exigent pas de ticket)
        type: string
        default: develop
      main-branch:
        description: Branche principale (production) ; une PR qui en part ne va que vers la branche d'intégration
        type: string
        default: main
      auto-validate:
        description: "Ticket ouvert par un mainteneur (droits d'écriture) validé d'office, sauf s'il porte « à décider » : maintainers, ou never (un mainteneur pose toujours « validé »)"
        type: string
        default: maintainers
      require-design:
        description: "Vérification « ticket » : le ticket doit porter une « Conception retenue » écrite par un mainteneur avant le code"
        type: boolean
        default: true
      auto-create:
        description: "Création automatique de ticket pour une PR sans ticket : true = crée un ticket « à valider », false = échec de la vérification avec la marche à suivre"
        type: boolean
        default: false
      auto-merge:
        description: "Merge automatique (squash) des PR de travail prêtes vers la branche d'intégration, ticket validé ; seulement avec la GitHub App"
        type: boolean
        default: true
      delivery-workflow:
        description: "Livraison ouverte par le workflow de release (release-auto) : une PR branche d'intégration → branche principale ouverte par une personne est fermée avec la marche à suivre"
        type: boolean
        default: false
      app-client-id:
        description: "GitHub App des workflows (repowarden app init : vars.REPOWARDEN_APP_CLIENT_ID) ; vide : jeton des Actions"
        type: string
        default: ""
      lang:
        description: "Langue des textes du bot (fr, en) ; vide : lang du .repowarden.conf de la branche par défaut du projet, sinon anglais"
        type: string
        default: ""
      repowarden-ref:
        description: Version de repowarden dont les scripts sont utilisés
        type: string
        default: v4
      repowarden-repository:
        description: Dépôt d'où viennent les scripts (repowarden lui-même passe le sien, à son propre commit)
        type: string
        default: simdevWarden/repowarden

    secrets:
      app-key:
        description: Clé privée de la GitHub App (secrets.REPOWARDEN_APP_KEY)
        required: false

permissions: {}

jobs:
  tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: tickets-${{ github.event.issue.number || github.event.pull_request.number || github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write # branche du ticket : création à la validation, suppression à l'abandon
      issues: write # tickets : création, statuts, commentaires, fermeture
      pull-requests: write # lien du ticket dans la description de la PR
      statuses: write # vérification « ticket » de la PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repowarden-repository }}
          ref: ${{ inputs.repowarden-ref }}
          path: .repowarden-ci
          persist-credentials: false
      # Jeton de la GitHub App : ce qu'il fait (PR brouillon, merge) déclenche
      # les autres workflows, contrairement au jeton des Actions.
      # Sur les branches dependabot/forks, le secret app-key n'est pas dispo :
      # continue-on-error évite l'échec, le fallback github.token prend le relais.
      - name: Jeton de l'App
        id: app
        if: inputs.app-client-id != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-key }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
      # Jeton refusé alors que la clé est fournie : le plus souvent l'App n'est
      # pas installée sur ce dépôt ; le suivi continue avec le jeton des Actions
      - name: App non installée ?
        if: steps.app.outcome == 'failure'
        env:
          AVEC_CLE: ${{ secrets.app-key != '' }}
          SLUG: ${{ vars.REPOWARDEN_APP_SLUG }}
        run: |
          [ "$AVEC_CLE" = true ] || exit 0
          echo "::warning title=Jeton de l'App refusé::L'App n'est sans doute pas installée sur $GITHUB_REPOSITORY (suivi fait avec le jeton des Actions : ses actions ne déclenchent pas les autres workflows). L'installer : https://github.com/apps/${SLUG:-<slug>}/installations/new ; si elle l'est, vérifier REPOWARDEN_APP_CLIENT_ID et REPOWARDEN_APP_KEY (repowarden app init)."
      - name: Tickets
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
          DELIVERED_SHA: ${{ inputs.delivered-sha }}
          INTEGRATION: ${{ inputs.integration-branch }}
          MAIN: ${{ inputs.main-branch }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          MERGED: ${{ github.event.pull_request.merged }}
          DRAFT: ${{ github.event.pull_request.draft }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_ASSOCIATION: ${{ github.event.issue.author_association }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          AUTO_VALIDATE: ${{ inputs.auto-validate }}
          AUTO_MERGE: ${{ inputs.auto-merge }}
          REQUIRE_DESIGN: ${{ inputs.require-design }}
          APP_TOKEN: ${{ steps.app.outputs.token != '' }}
          # Pied des commentaires du bot : lien vers la page de l'App (son avatar mène à une 404)
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          LABEL: ${{ github.event.label.name }}
          STATE_REASON: ${{ github.event.issue.state_reason }}
          PUSH_BRANCH: ${{ github.ref_name }}
          DELETED: ${{ github.event.deleted }}
          PUSHER: ${{ github.actor }}
          SHA: ${{ github.sha }}
          REVIEW_STATE: ${{ github.event.review.state }}
          AUTO_CREATE: ${{ inputs.auto-create }}
          DELIVERY_WORKFLOW: ${{ inputs.delivery-workflow }}
          LANG_INPUT: ${{ inputs.lang }}
        run: |
          # Langue du projet (description des PR, commentaires, pied du bot) :
          # son dépôt n'est pas récupéré, lang est lu par l'API
          REPOWARDEN_LANG="$(bash .repowarden-ci/ci/langue-projet.sh)"
          export REPOWARDEN_LANG
          if [ -n "$TAG" ] || [ -n "$DELIVERED_SHA" ]; then
            bash .repowarden-ci/ci/tickets.sh release
          elif [ "$EVENT" = issues ]; then
            bash .repowarden-ci/ci/tickets.sh issue
          elif [ "$EVENT" = push ]; then
            bash .repowarden-ci/ci/tickets.sh push
          elif [ "$EVENT" = pull_request_review ]; then
            bash .repowarden-ci/ci/tickets.sh revue
          else
            bash .repowarden-ci/ci/tickets.sh pr
          fi
