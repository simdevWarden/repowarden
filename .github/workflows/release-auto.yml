# Releases automatiques, réutilisables par tout projet (sans jeton personnel) :
#
#   jobs:
#     release:
#       uses: simdevWarden/repowarden/.github/workflows/release-auto.yml@v4
#       permissions: { contents: write, pull-requests: write, actions: write, checks: read, statuses: write }
#
# 1. release-please tient à jour une PR "release x.y.z" : version calculée
#    depuis les Conventional Commits, changelog, fichier de version du projet ;
# 2. la CI du projet est déclenchée sur cette PR (workflow_dispatch : seul type
#    d'événement que GITHUB_TOKEN a le droit de déclencher), son résultat réel
#    est reporté en statuts sur le commit, puis la PR est mergée (squash) ;
# 3. release-please, relancé, crée le tag vX.Y.Z et la release GitHub.
# Mode « tag » (flux develop → main, entrée mode: tag), conseillé : la release
# n'écrit aucun fichier (version portée par le tag, notes dans la release
# GitHub). Sur la branche d'intégration : préversion vX.Y.Z-next.N et PR de
# livraison develop → main tenues à jour ; la merger (humain) publie sur main
# le tag vX.Y.Z et la release. Un correctif urgent mergé sur main revient seul
# dans la branche d'intégration. Livraison approuvée par un humain (défaut :
# delivery-environment ou revue de PR) ou automatique (delivery-auto, choix du
# projet : la GitHub App la merge dès que les vérifications exigées sont vertes).
# Mode « cycle » (flux develop → main avec fichiers de version) : le travail
# s'intègre dans develop, une PR de livraison develop → main est tenue à jour ;
# la merger (humain, merge commit) déclenche sur main la release du mode pr
# (PR de release, changelog, fichiers de version, tag). Puis main est fusionnée
# dans develop par une PR mergée automatiquement (fichiers de version à jour).
# À chaque merge sur develop, une préversion (vX.Y.Z-next.N, release GitHub
# « pre-release ») est publiée pour que la communauté teste avant la prod.
# Les sorties (release_created, tag_name, version…) permettent au projet
# d'enchaîner ses propres jobs de publication (registre, image, paquet…).
name: release-auto

on:
  workflow_call:
    inputs:
      release-type:
        description: >-
          Type release-please (maven, node, python, rust, go, helm, simple…).
          Vide : release-please-config.json du projet s'il existe, sinon
          détection d'après les fichiers à la racine.
        type: string
        default: ""
      workflows:
        description: >-
          Workflows de CI à lancer sur la PR de release (noms de fichiers séparés
          par des espaces). Vide : ceux qui réagissent à la fois à pull_request
          et à workflow_dispatch.
        type: string
        default: ""
      initial-version:
        description: Version de la toute première release (aucun tag ni release existant).
        type: string
        default: 0.1.0
      merge-auto:
        description: >-
          Mode pr : merger la PR de release une fois la CI verte. false : la PR
          est préparée et validée, un humain la merge (et une relecture exigée
          par la protection de la branche est toujours respectée).
        type: boolean
        default: true
      mode:
        description: >-
          « pr » (défaut) : release-please, PR de release mergée automatiquement.
          « tag » : flux develop → main, version calculée et tag posé au merge sur main.
          « cycle » : flux develop → main, release du mode pr au merge de la
          livraison sur main, puis main fusionnée dans develop.
        type: string
        default: pr
      preversion-obligatoire:
        description: >-
          Modes tag et cycle : refuser une version stable qui n'a pas d'abord
          existé en préversion sur la branche d'intégration (vX.Y.Z-next.N) ;
          une majeure passe donc toujours par ses préversions.
        type: boolean
        default: true
      preversion:
        description: >-
          Modes tag et cycle : identifiant des préversions publiées à chaque merge sur
          la branche d'intégration (vX.Y.Z-next.N, release « pre-release »).
          Vide : aucune préversion.
        type: string
        default: next
      integration-branch:
        description: "Modes tag et cycle : branche d'intégration"
        type: string
        default: develop
      main-branch:
        description: "Mode tag : branche des releases"
        type: string
        default: main
      repowarden-ref:
        description: "Mode tag : version de repowarden utilisée pour calculer la version"
        type: string
        # Version majeure courante, à changer à la main à chaque majeure : la
        # release ne modifie aucun fichier de .github/workflows/ (le jeton des
        # Actions n'en a pas le droit)
        default: v4
      preversion-on-push:
        description: >-
          Mode tag : préversion à chaque merge sur la branche d'intégration.
          false (défaut) : préversion regroupée, seulement lors d'un
          déclenchement planifié ou manuel, si la branche a changé.
        type: boolean
        default: false
      delivery-on-push:
        description: >-
          Mode tag : demande de livraison (approbation) à chaque merge. false
          (défaut) : seulement dans la fenêtre (déclenchement planifié
          delivery-schedule, ou manuel), ou pour un merge étiqueté « urgent ».
        type: boolean
        default: false
      delivery-schedule:
        description: "Mode tag : expression cron du déclenchement planifié qui ouvre la fenêtre de livraison (doit figurer dans les déclencheurs de l'appelant)"
        type: string
        default: ""
      delivery-environment:
        description: >-
          Mode tag : environnement de déploiement dont l'approbation (« Approve
          and deploy ») valide la livraison ; la GitHub App merge alors la PR
          de livraison. Vide : la livraison se merge à la main (revue de PR).
        type: string
        default: ""
      delivery-auto:
        description: >-
          Mode tag : livraison automatique, choix du projet (la validation
          humaine est le merge de chaque ticket). La GitHub App arme le merge
          de la PR de livraison quand une livraison est demandée (à chaque
          merge avec delivery-on-push, sinon fenêtre, manuel, urgence) ; elle
          part dès que les vérifications exigées sont vertes. Sans App : merge
          à la main. Exclut delivery-environment. false (défaut) : approbation.
        type: boolean
        default: false
      app-client-id:
        description: "GitHub App des workflows (repowarden app init : vars.REPOWARDEN_APP_CLIENT_ID), pour merger la livraison approuvée"
        type: string
        default: ""
      notify:
        description: >-
          Événements envoyés au canal de l'équipe (secret webhook) : release
          (publiée), attente (PR de release à approuver), echec (workflow en échec).
        type: string
        default: release attente echec
      config-file:
        type: string
        default: release-please-config.json
      manifest-file:
        type: string
        default: .release-please-manifest.json
    secrets:
      webhook:
        description: Adresse du webhook entrant du canal de l'équipe (Slack, Teams, Discord…)
        required: false
      app-id:
        description: Obsolète, ignoré (ancien bot de release ; refusé en v4)
        required: false
      app-key:
        description: Clé privée de la GitHub App (secrets.REPOWARDEN_APP_KEY), avec app-client-id
        required: false
    outputs:
      release_created:
        value: ${{ jobs.release.outputs.release_created || jobs.tag.outputs.release_created }}
      tag_name:
        value: ${{ jobs.release.outputs.tag_name || jobs.tag.outputs.tag_name }}
      version:
        value: ${{ jobs.release.outputs.version || jobs.tag.outputs.version }}
      major:
        value: ${{ jobs.release.outputs.major || jobs.tag.outputs.major }}
      sha:
        value: ${{ jobs.release.outputs.sha || jobs.tag.outputs.sha }}
      prerelease_created:
        description: "Mode cycle : préversion publiée sur la branche d'intégration"
        value: ${{ jobs.tag.outputs.prerelease_created }}
      prerelease_tag:
        value: ${{ jobs.tag.outputs.prerelease_tag }}
      prerelease_version:
        value: ${{ jobs.tag.outputs.prerelease_version }}
      delivery_pr:
        description: "Mode tag : numéro de la PR de livraison créée ou mise à jour (vide : aucune)"
        value: ${{ jobs.tag.outputs.delivery_pr }}
      delivered_without_version:
        description: "Mode tag : commit livré sur la branche principale sans nouvelle version (ni fix ni feat) ; vide sinon"
        value: ${{ jobs.tag.outputs.delivered_without_version }}

permissions: {}

jobs:
  release:
    if: inputs.mode == 'pr' || (inputs.mode == 'cycle' && github.ref_name == inputs.main-branch)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      actions: write # déclencher la CI sur la PR de release, approuver ses runs
      checks: read
      statuses: write # reporter le résultat de cette CI sur le commit
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.publish.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.publish.outputs.tag_name }}
      version: ${{ steps.release.outputs.version || steps.publish.outputs.version }}
      major: ${{ steps.release.outputs.major || steps.publish.outputs.major }}
      sha: ${{ steps.release.outputs.sha || steps.publish.outputs.sha }}
      waiting_pr: ${{ steps.merge.outputs.waiting_pr }}
    env:
      HAS_APP: ${{ inputs.app-client-id != '' && secrets.app-key != '' }}
      HAS_OLD_BOT: ${{ secrets.app-id != '' && secrets.app-key != '' }}
    steps:
      # Ancien bot de release (GitHub App) : entrées obsolètes, ignorées
      - name: Entrées obsolètes
        if: env.HAS_OLD_BOT == 'true'
        run: |
          echo "::warning::Secrets app-id / app-key ignorés : le bot de release n'existe plus (aucune clé nécessaire). Les retirer de release.yml ; ils seront refusés en v4."
      # Jeton de la GitHub App : ce qu'il fait (créer/mettre à jour des PR)
      # déclenche les autres workflows, contrairement au jeton des Actions.
      - name: Jeton de l'App
        id: app
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-key }}
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write
      # Jeton refusé : le plus souvent l'App n'est pas installée sur ce dépôt
      # (Not Found - get-a-repository-installation…) ; le dire avec le lien
      - name: App non installée ?
        if: failure() && steps.app.outcome == 'failure'
        env:
          SLUG: ${{ vars.REPOWARDEN_APP_SLUG }}
        run: |
          echo "::error title=Jeton de l'App refusé::L'App n'est sans doute pas installée sur $GITHUB_REPOSITORY : l'installer (https://github.com/apps/${SLUG:-<slug>}/installations/new, dépôt $GITHUB_REPOSITORY), puis relancer ce run. Si elle l'est, vérifier la variable REPOWARDEN_APP_CLIENT_ID et le secret REPOWARDEN_APP_KEY (repowarden app init)."
      # Aucun code du projet n'est exécuté : seuls les scripts de repowarden, à
      # la version repowarden-ref (validation et merge des PR : ci/merger-pr.sh)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: simdevWarden/repowarden
          ref: ${{ inputs.repowarden-ref }}
          path: .repowarden-ci
          persist-credentials: false
      - name: Configuration
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TYPE: ${{ inputs.release-type }}
          CONFIG_FILE: ${{ inputs.config-file }}
          WORKFLOWS: ${{ inputs.workflows }}
          CALLER: ${{ github.workflow_ref }}
          INITIAL_VERSION: ${{ inputs.initial-version }}
        run: |
          existe() { gh api "repos/$GH_REPO/contents/$1?ref=$GITHUB_REF_NAME" --silent 2>/dev/null; }
          type="$RELEASE_TYPE"
          if [ -z "$type" ] && existe "$CONFIG_FILE"; then
            echo "Configuration : $CONFIG_FILE"
          elif [ -z "$type" ]; then
            # Fichier de version du projet, à la racine
            type=simple
            for paire in pom.xml:maven package.json:node pyproject.toml:python setup.py:python \
              Cargo.toml:rust Chart.yaml:helm go.mod:go composer.json:php pubspec.yaml:dart \
              mix.exs:elixir; do
              if existe "${paire%%:*}"; then type="${paire#*:}"; break; fi
            done
            echo "Type détecté : $type (fixer avec l'entrée release-type, ou $CONFIG_FILE)"
          fi
          echo "type=$type" >>"$GITHUB_OUTPUT"

          # Première release : version initiale choisie (release-please partirait de 1.0.0)
          if [ -z "$(gh release list --limit 1 --json tagName -q '.[].tagName')" ] &&
            [ "$(gh api "repos/$GH_REPO/tags?per_page=1" --jq length)" = 0 ]; then
            echo "Première release : $INITIAL_VERSION"
            echo "release_as=$INITIAL_VERSION" >>"$GITHUB_OUTPUT"
          fi

          if [ -z "$WORKFLOWS" ]; then
            appelant="${CALLER%%@*}"
            appelant="${appelant##*/}"
            for f in $(gh api "repos/$GH_REPO/contents/.github/workflows?ref=$GITHUB_REF_NAME" \
              --jq '.[] | select(.name | test("\\.ya?ml$")) | .name'); do
              [ "$f" = "$appelant" ] && continue
              contenu="$(gh api "repos/$GH_REPO/contents/.github/workflows/$f?ref=$GITHUB_REF_NAME" \
                --jq .content | base64 -d)"
              if grep -qw pull_request <<<"$contenu" && grep -qw workflow_dispatch <<<"$contenu"; then
                WORKFLOWS="$WORKFLOWS $f"
              fi
            done
          fi
          echo "Workflows de CI pour la PR de release :${WORKFLOWS:- aucun}"
          echo "workflows=$WORKFLOWS" >>"$GITHUB_OUTPUT"

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          # Branche du push (main en mode cycle) : sans cela, release-please vise
          # la branche par défaut du dépôt, develop dans le flux develop → main
          target-branch: ${{ github.ref_name }}
          release-type: ${{ steps.config.outputs.type }}
          release-as: ${{ steps.config.outputs.release_as }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

      - name: CI sur la PR de release, puis merge
        id: merge
        # PR créée ou mise à jour par ce run, sinon PR déjà ouverte restée en
        # attente (release-please ne la renvoie que s'il la modifie)
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.release.outputs.pr }}
          WORKFLOWS: ${{ steps.config.outputs.workflows }}
          MERGE_AUTO: ${{ inputs.merge-auto }}
          BASE: ${{ github.ref_name }}
        run: |
          if [ -n "$PR_JSON" ]; then
            pr="$(jq -r .number <<<"$PR_JSON")"
          else
            pr="$(gh pr list --state open --base "$BASE" --label 'autorelease: pending' \
              --json number -q '.[0].number')"
          fi
          [ -n "$pr" ] || { echo "Aucune PR de release en attente"; exit 0; }
          bash .repowarden-ci/ci/merger-pr.sh "$pr" squash

      # Le merge fait par GITHUB_TOKEN ne relance pas le workflow : on publie ici
      - id: publish
        if: steps.merge.outputs.merged == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          target-branch: ${{ github.ref_name }}
          release-type: ${{ steps.config.outputs.type }}
          release-as: ${{ steps.config.outputs.release_as }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          skip-github-pull-request: true

      # Mode cycle : la release (changelog, fichiers de version) revient dans
      # la branche d'intégration par une PR validée par la CI puis mergée
      # (merge commit), comme la PR de release.
      - name: Retour vers la branche d'intégration
        if: >-
          inputs.mode == 'cycle' &&
          (steps.release.outputs.release_created == 'true' || steps.publish.outputs.release_created == 'true')
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token != '' }}
          GH_REPO: ${{ github.repository }}
          WORKFLOWS: ${{ steps.config.outputs.workflows }}
          INTEGRATION: ${{ inputs.integration-branch }}
          MAIN: ${{ inputs.main-branch }}
          BASE: ${{ inputs.integration-branch }}
          MERGE_AUTO: "true"
          TAG: ${{ steps.release.outputs.tag_name || steps.publish.outputs.tag_name }}
        run: |
          if [ "$APP_TOKEN" != true ]; then
            echo "::warning::Pas de GitHub App configurée (entrée app-client-id) : la PR de retour est créée/mise à jour avec le jeton des Actions. Ce jeton ne déclenche pas les autres workflows. Pour activer l'App : repowarden app init."
          fi
          if [ "$(gh api "repos/$GH_REPO/compare/$INTEGRATION...$MAIN" --jq '.files | length')" = 0 ]; then
            echo "$INTEGRATION contient déjà tout le contenu de $MAIN : rien à fusionner."
            exit 0
          fi
          pr="$(gh pr list --head "$MAIN" --base "$INTEGRATION" --state open --json number -q '.[0].number // empty')"
          if [ -z "$pr" ]; then
            url="$(gh pr create --head "$MAIN" --base "$INTEGRATION" \
              --title "chore(release): $INTEGRATION à jour de $TAG" \
              --body "Fusionne la release **$TAG** (changelog, fichiers de version) dans \`$INTEGRATION\`. Validée par la CI puis mergée automatiquement (merge commit) par le workflow de release (repowarden).")"
            pr="${url##*/}"
          fi
          bash .repowarden-ci/ci/merger-pr.sh "$pr" merge

      - name: Aide
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat <<'EOF'
          ::notice::Si release-please indique « GitHub Actions is not permitted to create or approve pull requests » :
          Settings → Actions → General → Workflow permissions → cocher « Allow GitHub Actions to create and approve pull requests ».
          EOF
          # PR de release mergée mais pas publiée, dont les workflows diffèrent
          # de la branche actuelle : GitHub exige la permission « workflow »
          # pour créer son tag, que le jeton des Actions n'a jamais (refus
          # « Resource not accessible by integration »). Cas d'une PR de release
          # mergée à la main, suivie d'un changement de workflow avant la release.
          pr="$(gh pr list --state merged --base "$GITHUB_REF_NAME" --label 'autorelease: pending' \
            --json number,title,mergeCommit -q '.[0] // empty' 2>/dev/null || true)"
          [ -n "$pr" ] || exit 0
          num="$(jq -r .number <<<"$pr")"
          title="$(jq -r .title <<<"$pr")"
          sha="$(jq -r .mergeCommit.oid <<<"$pr")"
          version="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^ ]*' <<<"$title" | head -n1)"
          changed="$(gh api "repos/$GH_REPO/compare/$sha...$GITHUB_SHA" \
            --jq '[.files[]?.filename | select(startswith(".github/workflows/"))] | join(" ")' 2>/dev/null || true)"
          [ -n "$changed" ] || exit 0
          echo "::error title=Release bloquée::La PR de release #$num ($title) est mergée mais son tag ne peut pas être créé par le jeton des Actions : les workflows ont changé depuis ($changed). GitHub exige la permission « workflow »."
          cat <<EOF
          Débloquer (une fois, avec un compte qui a la permission « workflow ») :
            gh auth refresh -h github.com -s workflow
            gh pr view $num -R $GH_REPO --json body -q .body > notes.md   # notes de version
            gh release create v$version -R $GH_REPO --target $sha --title v$version --notes-file notes.md
            gh pr edit $num -R $GH_REPO --remove-label "autorelease: pending" --add-label "autorelease: tagged"
          puis relancer ce workflow. Pour l'éviter : laisser le workflow merger la PR de release (il publie
          aussitôt), sans merger de changement de .github/workflows/ pendant la publication.
          EOF

  # Mode tag : flux develop → main
  tag:
    if: inputs.mode == 'tag' || (inputs.mode == 'cycle' && github.ref_name == inputs.integration-branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag et release
      pull-requests: write # PR de livraison, retour vers la branche d'intégration
      actions: write # retour : lancer la CI sur sa PR
      checks: read
      statuses: write # retour : reporter le résultat de cette CI
      # Notes de version : titres des tickets livrés (dépôt privé : sans cette
      # permission, illisibles). L'appelant doit l'accorder (release.yml)
      issues: read
    outputs:
      release_created: ${{ steps.publier.outputs.release_created }}
      tag_name: ${{ steps.publier.outputs.tag_name }}
      version: ${{ steps.publier.outputs.version }}
      major: ${{ steps.publier.outputs.major }}
      sha: ${{ steps.publier.outputs.sha }}
      prerelease_created: ${{ steps.preversion.outputs.created }}
      prerelease_tag: ${{ steps.preversion.outputs.tag }}
      prerelease_version: ${{ steps.preversion.outputs.version }}
      delivery_pr: ${{ steps.livraison.outputs.pr }}
      delivered_without_version: ${{ steps.publier.outputs.delivered_without_version }}
    env:
      HAS_APP: ${{ inputs.app-client-id != '' && secrets.app-key != '' }}
      HAS_OLD_BOT: ${{ secrets.app-id != '' && secrets.app-key != '' }}
    steps:
      # Ancien bot de release (GitHub App) : entrées obsolètes, ignorées
      - name: Entrées obsolètes
        if: env.HAS_OLD_BOT == 'true'
        run: |
          echo "::warning::Secrets app-id / app-key ignorés : le bot de release n'existe plus (aucune clé nécessaire). Les retirer de release.yml ; ils seront refusés en v4."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags et historique : calcul de version
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: simdevWarden/repowarden
          ref: ${{ inputs.repowarden-ref }}
          path: .repowarden-ci
          persist-credentials: false

      # Jeton de la GitHub App : ce qu'il fait (créer/mettre à jour des PR)
      # déclenche les autres workflows, contrairement au jeton des Actions.
      - name: Jeton de l'App
        id: app
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-key }}
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write
      # Jeton refusé : le plus souvent l'App n'est pas installée sur ce dépôt
      # (Not Found - get-a-repository-installation…) ; le dire avec le lien
      - name: App non installée ?
        if: failure() && steps.app.outcome == 'failure'
        env:
          SLUG: ${{ vars.REPOWARDEN_APP_SLUG }}
        run: |
          echo "::error title=Jeton de l'App refusé::L'App n'est sans doute pas installée sur $GITHUB_REPOSITORY : l'installer (https://github.com/apps/${SLUG:-<slug>}/installations/new, dépôt $GITHUB_REPOSITORY), puis relancer ce run. Si elle l'est, vérifier la variable REPOWARDEN_APP_CLIENT_ID et le secret REPOWARDEN_APP_KEY (repowarden app init)."

      - name: PR de livraison
        id: livraison
        if: github.ref_name == inputs.integration-branch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token != '' }}
          INTEGRATION: ${{ inputs.integration-branch }}
          MAIN: ${{ inputs.main-branch }}
          INITIAL_VERSION: ${{ inputs.initial-version }}
          MODE: ${{ inputs.mode }}
          DELIVERY_AUTO: ${{ inputs.delivery-auto }}
          DELIVERY_ENV: ${{ inputs.delivery-environment }}
          # Livraison approuvée (environnement) : la PR part d'un instantané de
          # develop, créé seulement à la demande (fenêtre, manuelle, urgence)
          INSTANTANE: ${{ inputs.mode == 'tag' && inputs.delivery-environment != '' }}
          DEMANDE: >-
            ${{ github.event_name == 'workflow_dispatch' || inputs.delivery-on-push ||
            (github.event_name == 'schedule' && github.event.schedule == inputs.delivery-schedule) }}
        run: |
          # Deux modes exclusifs : approuvée (environnement) ou automatique
          if [ "$DELIVERY_AUTO" = true ] && [ -n "$DELIVERY_ENV" ]; then
            echo "::error::delivery-auto et delivery-environment ensemble : choisir la livraison automatique (retirer delivery-environment) ou approuvée (retirer delivery-auto)."
            exit 1
          fi
          if [ "$APP_TOKEN" != true ]; then
            echo "::warning::Pas de GitHub App configurée (entrée app-client-id) : la PR de livraison est créée/mise à jour avec le jeton des Actions. Ce jeton ne déclenche pas les autres workflows (ex. suivi des tickets). Pour activer l'App : repowarden app init."
          fi
          # Identifiants par le jeton de l'étape (GH_TOKEN, via gh) : un dépôt
          # privé refuse le fetch anonyme (checkout sans identifiants persistés)
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch -q origin "$MAIN"
          pr="$(gh pr list --head "$INTEGRATION" --base "$MAIN" --state open --json number -q '.[0].number // empty')"
          if [ -z "$(git log --oneline "origin/$MAIN..HEAD")" ]; then
            echo "$INTEGRATION ne contient rien de plus que $MAIN : pas de livraison."
            exit 0
          fi
          version="$(bash .repowarden-ci/ci/version.sh next HEAD)"
          if [ -n "$version" ]; then
            title="chore(release): v$version"
            if [ "$MODE" = cycle ]; then
              suite="lance la release **v%s** sur $MAIN : PR de release (changelog, fichiers de version), tag et publication automatiques"
            else
              suite="publie **v%s** : tag et release GitHub automatiques"
            fi
            body="$(printf "Merger cette PR (merge commit) $suite.\n\n%s\n\n---\n_Tenue à jour à chaque merge sur %s (repowarden)._\n" \
              "$version" "$(bash .repowarden-ci/ci/version.sh notes HEAD)" "$INTEGRATION")"
          else
            title="chore(release): livrer $INTEGRATION sur $MAIN"
            body="Aucune nouvelle version : maintenance uniquement (ci, chore, docs…)."
          fi
          if [ "$INSTANTANE" = true ]; then
            # Instantané : l'approbation porte sur ce commit exact ; ce qui est
            # mergé ensuite dans develop partira à la livraison suivante
            if [ "$DEMANDE" != true ]; then
              echo "Livraison à venir : $title (demandée dans la fenêtre de livraison)."
              exit 0
            fi
            # Une seule demande en attente : les précédentes sont fermées (leur
            # instantané : étape « Instantanés de livraison abandonnés »)
            while IFS=$'\t' read -r ancienne tete; do
              [ -n "$ancienne" ] || continue
              if [[ "$tete" == livraison/* ]]; then
                gh pr close "$ancienne" --comment "Remplacée par une demande de livraison plus récente." >/dev/null
              else
                gh pr close "$ancienne" --comment "Remplacée par une demande de livraison sur un instantané de $INTEGRATION." >/dev/null
              fi
            done < <(gh pr list --base "$MAIN" --state open --json number,headRefName \
              -q ".[] | select(.headRefName == \"$INTEGRATION\" or (.headRefName | startswith(\"livraison/\"))) | [.number, .headRefName] | @tsv")
            branche="livraison/${version:+v}${version:-maintenance}"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branche" >/dev/null 2>&1 || true
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branche" -f sha="$GITHUB_SHA" >/dev/null
            # PR ouverte par le jeton des Actions : le suivi des tickets ne s'y
            # lance pas ; une livraison n'exige pas de ticket
            gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=ticket \
              -f description="Livraison : sans ticket" >/dev/null
            body="$(printf '%s\n\n_Instantané de %s au commit %s : approuver la demande de déploiement suffit, le travail mergé ensuite partira à la livraison suivante._\n' \
              "$body" "$INTEGRATION" "${GITHUB_SHA:0:7}")"
            url="$(gh pr create --head "$branche" --base "$MAIN" --title "$title" --body "$body")"
            echo "pr=${url##*/}" >>"$GITHUB_OUTPUT"
            echo "::notice::Demande de livraison : $title ($branche)"
            exit 0
          fi
          # Une seule demande de livraison ouverte à la fois : si une demande
          # (instantané livraison/*) est déjà en attente d'approbation, ce merge
          # partira à la livraison suivante ; pas de PR develop → main.
          livraison_en_attente="$(bash .repowarden-ci/ci/livraison.sh en-attente)"
          if [ -n "$livraison_en_attente" ]; then
            echo "::notice::demande de livraison #$livraison_en_attente en attente (instantané) : ce merge partira à la livraison suivante"
            echo "pr=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body "$body" >/dev/null
            echo "::notice::PR #$pr : $title"
          else
            url="$(gh pr create --head "$INTEGRATION" --base "$MAIN" --title "$title" --body "$body")"
            pr="${url##*/}"
            echo "::notice::PR de livraison créée : $title"
          fi
          echo "pr=$pr" >>"$GITHUB_OUTPUT"

      # Merge étiqueté « urgent » (faille, régression bloquante) : demande de
      # livraison tout de suite, dans un run manuel (sa propre file : un run de
      # push en attente d'approbation bloquerait les merges suivants)
      - name: Urgence
        if: >-
          inputs.mode == 'tag' && (inputs.delivery-environment != '' || inputs.delivery-auto) &&
          !inputs.delivery-on-push && github.event_name == 'push' && github.ref_name == inputs.integration-branch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token != '' }}
          GH_REPO: ${{ github.repository }}
          INTEGRATION: ${{ inputs.integration-branch }}
          CALLER: ${{ github.workflow_ref }}
        run: |
          if [ "$APP_TOKEN" != true ]; then
            echo "::warning::Pas de GitHub App configurée (entrée app-client-id) : le déclenchement d'urgence utilise le jeton des Actions. Pour activer l'App : repowarden app init."
          fi
          if [ "$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" -q '[.[].labels[].name] | index("urgent") != null')" = true ]; then
            fichier="${CALLER%%@*}"
            gh workflow run "${fichier##*/}" --ref "$INTEGRATION"
            echo "::notice::Merge urgent : demande de livraison lancée."
          fi

      # Mode cycle : préversion de test à chaque merge sur la branche
      # d'intégration ; numéro = commits depuis la branche principale
      - name: Préversion
        id: preversion
        if: >-
          (inputs.mode == 'tag' || inputs.mode == 'cycle') && inputs.preversion != '' &&
          github.ref_name == inputs.integration-branch &&
          (inputs.mode == 'cycle' || github.event_name != 'push' || inputs.preversion-on-push)
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ inputs.main-branch }}
          ID: ${{ inputs.preversion }}
          INITIAL_VERSION: ${{ inputs.initial-version }}
        run: |
          # Identifiants par le jeton de l'étape (GH_TOKEN, via gh) : un dépôt
          # privé refuse le fetch anonyme (checkout sans identifiants persistés)
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch -q origin "$MAIN"
          base="$(bash .repowarden-ci/ci/version.sh next HEAD)"
          if [ -z "$base" ]; then
            echo "Aucune nouvelle version (ci, chore, docs…) : pas de préversion."
            exit 0
          fi
          version="$base-$ID.$(git rev-list --count "origin/$MAIN..HEAD")"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag existe déjà : rien à faire."
            exit 0
          fi
          {
            echo "> ⚠️ Préversion de test, à ne pas utiliser en production : la version stable sortira au merge de la livraison."
            echo
            bash .repowarden-ci/ci/version.sh notes HEAD
          } >"$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          {
            echo "created=true"
            echo "tag=$tag"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"
          echo "::notice::Préversion $tag publiée"

      # Statut « livraison » de la tête de la branche d'intégration (donc de sa
      # PR de livraison), exigé sur la branche principale par repowarden
      # proteger : en échec tant que la livraison ne peut pas aboutir
      # (protection du flux absente, version jamais publiée en préversion)
      - name: Garde-fou de livraison
        if: github.ref_name == inputs.integration-branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INTEGRATION: ${{ inputs.integration-branch }}
          ID: ${{ inputs.preversion }}
          OBLIGATOIRE: ${{ inputs.preversion-obligatoire }}
          INITIAL_VERSION: ${{ inputs.initial-version }}
          PREVERSION_CREEE: ${{ steps.preversion.outputs.tag }}
        run: bash .repowarden-ci/ci/livraison.sh poster "$GITHUB_SHA"

      # Livraison automatique (delivery-auto, choix du projet) : la validation
      # humaine est le merge de chaque ticket. Quand une livraison est demandée,
      # la GitHub App arme le merge de la PR de livraison, qui part dès que les
      # vérifications exigées sur la branche principale sont vertes. L'App,
      # jamais le jeton des Actions : son merge déclenche le tag et la release.
      - name: Livraison automatique
        if: >-
          inputs.mode == 'tag' && inputs.delivery-auto && steps.livraison.outputs.pr != '' &&
          (github.event_name == 'workflow_dispatch' || inputs.delivery-on-push ||
          (github.event_name == 'schedule' && github.event.schedule == inputs.delivery-schedule))
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.livraison.outputs.pr }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Livraison automatique demandée (delivery-auto), mais pas de GitHub App (entrée app-client-id, repowarden app init) : merger la PR #$PR à la main (avec le jeton des Actions, la release ne se lancerait pas)."
            exit 0
          fi
          # Vérifications déjà vertes : GitHub refuse d'armer, merge direct
          # (les règles de la branche principale s'appliquent de même)
          gh pr merge "$PR" --auto --merge || gh pr merge "$PR" --merge
          echo "::notice::Livraison automatique : PR #$PR mergée dès que les vérifications exigées sont vertes, puis tag et release."

      - name: Tag et release
        id: publier
        if: inputs.mode == 'tag' && github.ref_name == inputs.main-branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INITIAL_VERSION: ${{ inputs.initial-version }}
          OBLIGATOIRE: ${{ inputs.preversion-obligatoire }}
          ID: ${{ inputs.preversion }}
          INTEGRATION: ${{ inputs.integration-branch }}
        run: |
          version="$(bash .repowarden-ci/ci/version.sh next HEAD)"
          if [ -z "$version" ]; then
            echo "Rien à publier."
            # Livraison sans fix ni feat (docs, refactor, CI) : main à jour
            # sans tag ; signalée pour fermer tout de même les tickets livrés.
            # Un lancement manuel ou planifié ne livre rien.
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "delivered_without_version=$GITHUB_SHA" >>"$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::warning::$tag existe déjà : rien à faire."
            exit 0
          fi
          # Aucune version stable sans préversion testée sur la branche
          # d'intégration (une majeure passe par ses vX.0.0-next.N). Sur main,
          # HEAD est le merge commit de la livraison, qu'aucune préversion ne
          # contient : vérifier le commit livré (son second parent).
          livre="$(bash .repowarden-ci/ci/livraison.sh commit-livre)"
          if [ "$OBLIGATOIRE" = true ] && [ -n "$ID" ] && [ -z "$(git tag --contains "$livre" --list "$tag-$ID.*")" ]; then
            echo "::error::$tag refusée : aucune préversion $tag-$ID.N publiée depuis $INTEGRATION. Livrer depuis $INTEGRATION (préversion testée), ou désactiver preversion-obligatoire."
            exit 1
          fi
          # Notes de la PR de livraison mergée : ce que l'approbateur a relu,
          # corrections comprises ; sinon recalculées
          bash .repowarden-ci/ci/version.sh notes-livraison HEAD >"$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          # Ses préversions ont servi : retirées de GitHub (releases et tags) ;
          # sur npm elles restent (une version publiée ne se retire pas)
          for pre in $(git tag --list "$tag-*"); do
            gh release delete "$pre" --yes --cleanup-tag >/dev/null 2>&1 ||
              echo "::warning::Préversion $pre non retirée (tags protégés ?)."
          done
          {
            echo "release_created=true"
            echo "tag_name=$tag"
            echo "version=$version"
            echo "major=${version%%.*}"
            echo "sha=$GITHUB_SHA"
          } >>"$GITHUB_OUTPUT"

      # Instantanés livraison/* d'une demande remplacée, fermée sans fusion ou
      # déjà publiée : supprimés s'ils n'ont aucun commit absent de la branche
      # d'intégration ; jamais la livraison en attente la plus récente. Ici et
      # non au nettoyage des branches : une PR fermée par le jeton des Actions
      # ne le déclenche pas, et il ne voit pas la publication du tag.
      - name: Instantanés de livraison abandonnés
        if: >-
          inputs.mode == 'tag' && inputs.delivery-environment != '' &&
          (github.ref_name == inputs.integration-branch || github.ref_name == inputs.main-branch)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
          INTEGRATION: ${{ inputs.integration-branch }}
        run: bash .repowarden-ci/ci/instantanes.sh

      # Mode tag : seuls develop et ses instantanés livraison/* entrent dans
      # main (vérification de branche), qui n'a donc jamais de contenu propre.
      # Si c'est le cas malgré tout, ce n'est pas rapporté automatiquement dans
      # develop (squash seul) : signalé, à reporter par une PR de travail.
      - name: Contenu propre à la branche principale
        if: inputs.mode == 'tag' && github.ref_name == inputs.main-branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INTEGRATION: ${{ inputs.integration-branch }}
          MAIN: ${{ inputs.main-branch }}
        run: |
          # Contenus comparés, pas les historiques : une livraison squashée puis
          # réunie dans la branche d'intégration n'est pas du contenu propre
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch -q origin "$INTEGRATION"
          fichiers="$(git diff --name-only "origin/$INTEGRATION" HEAD | paste -sd, - | sed 's/,/, /g')"
          if [ -z "$fichiers" ]; then
            echo "$INTEGRATION contient déjà tout le contenu de $MAIN."
            exit 0
          fi
          echo "::error::$MAIN contient du contenu absent de $INTEGRATION ($fichiers) : seuls $INTEGRATION et ses instantanés livraison/* devraient y entrer. Le reporter dans $INTEGRATION par une PR de travail (squashée), et chercher comment il est arrivé sur $MAIN."
          exit 1

  # Canal de l'équipe (optionnel) : release publiée, PR de release à approuver,
  # échec. Sans secret webhook, rien n'est envoyé. Message dans la langue du projet.
  # Mode tag : livraison validée par l'approbation de l'environnement
  # delivery-environment (une seule en attente : la plus récente) ; approuvée,
  # la GitHub App arme le merge de la PR de livraison, qui part dès que les
  # vérifications et ce déploiement sont réussis (règle de la branche
  # principale). L'App, et non le jeton des Actions : le merge déclenche ainsi
  # la release sur la branche principale.
  livraison:
    needs: tag
    # Fenêtre de livraison : déclenchement planifié delivery-schedule, ou
    # manuel (dont l'urgence) ; à chaque merge seulement avec delivery-on-push
    if: >-
      inputs.mode == 'tag' && inputs.delivery-environment != '' &&
      github.ref_name == inputs.integration-branch && needs.tag.outputs.delivery_pr != '' &&
      (github.event_name == 'workflow_dispatch' || inputs.delivery-on-push ||
      (github.event_name == 'schedule' && github.event.schedule == inputs.delivery-schedule))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.delivery-environment }}
    concurrency:
      group: livraison-${{ github.repository }}
      cancel-in-progress: true
    permissions:
      actions: read # approbations du run (vérification ci-dessous)
    steps:
      # Garde-fou : un environnement sans approbateur (ex. créé par GitHub au
      # premier run, avant repowarden proteger) laisserait passer ce job sans
      # personne ; rien n'est armé sans une approbation humaine de ce run
      - name: Approbation humaine
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          ENV: ${{ inputs.delivery-environment }}
        run: |
          qui="$(gh api "repos/$GH_REPO/actions/runs/$RUN/approvals" \
            -q "[.[] | select(.state == \"approved\" and ([.environments[].name] | index(\"$ENV\"))) | .user.login] | join(\", \")")"
          if [ -z "$qui" ]; then
            echo "::error::Livraison non approuvée : l'environnement $ENV n'exige aucune approbation. Lancer repowarden proteger (approbateurs de l'environnement, règle de main), puis relancer ce run."
            exit 1
          fi
          echo "::notice::Livraison approuvée par $qui."
      - name: Jeton de l'App
        id: app
        if: inputs.app-client-id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-key }}
          permission-contents: write
          permission-pull-requests: write
      # Jeton refusé : le plus souvent l'App n'est pas installée sur ce dépôt
      # (Not Found - get-a-repository-installation…) ; le dire avec le lien
      - name: App non installée ?
        if: failure() && steps.app.outcome == 'failure'
        env:
          SLUG: ${{ vars.REPOWARDEN_APP_SLUG }}
        run: |
          echo "::error title=Jeton de l'App refusé::L'App n'est sans doute pas installée sur $GITHUB_REPOSITORY : l'installer (https://github.com/apps/${SLUG:-<slug>}/installations/new, dépôt $GITHUB_REPOSITORY), puis relancer ce run. Si elle l'est, vérifier la variable REPOWARDEN_APP_CLIENT_ID et le secret REPOWARDEN_APP_KEY (repowarden app init)."
      - name: Merge de la livraison approuvée
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.tag.outputs.delivery_pr }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Livraison approuvée, mais pas de GitHub App (repowarden app init) : merger la PR #$PR à la main (avec le jeton des Actions, la release ne se lancerait pas)."
            exit 1
          fi
          gh pr merge "$PR" --auto --merge
          echo "::notice::Livraison approuvée : PR #$PR mergée dès que les vérifications sont vertes, puis tag et release."

  notifier:
    needs: [release, tag]
    if: always() && !cancelled()
    # Une notification ne fait jamais échouer une release (ni sauter ses suites)
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .repowarden.conf # langue du projet
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: simdevWarden/repowarden
          ref: ${{ inputs.repowarden-ref }}
          path: .repowarden-ci
          persist-credentials: false
      - name: Notifier
        env:
          REPOWARDEN_WEBHOOK: ${{ secrets.webhook }}
          EVENTS: ${{ inputs.notify }}
          CREATED: ${{ needs.release.outputs.release_created || needs.tag.outputs.release_created }}
          TAG: ${{ needs.release.outputs.tag_name || needs.tag.outputs.tag_name }}
          WAITING: ${{ needs.release.outputs.waiting_pr }}
          FAILED: ${{ needs.release.result == 'failure' || needs.tag.result == 'failure' }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          REPOWARDEN_REF: ${{ inputs.repowarden-ref }}
        run: |
          # Version de repowarden sans notifications (ancien tag) : rien à faire
          [ -f .repowarden-ci/ci/notifier.sh ] || { echo "notifier.sh absent de $REPOWARDEN_REF : ignoré"; exit 0; }
          notifier() { bash .repowarden-ci/ci/notifier.sh "$@"; }
          a_notifier() { [[ " $EVENTS " == *" $1 "* ]]; }
          if [ "$FAILED" = true ] && a_notifier echec; then
            notifier ci.notify.failure "$REPO" "$SERVER/$REPO/actions/runs/$RUN_ID"
          elif [ "$CREATED" = true ] && a_notifier release; then
            notifier ci.notify.released "$REPO" "$TAG" "$SERVER/$REPO/releases/tag/$TAG"
          elif [ -n "$WAITING" ] && a_notifier attente; then
            notifier ci.notify.waiting "$REPO" "$WAITING" "$SERVER/$REPO/pull/$WAITING"
          fi
