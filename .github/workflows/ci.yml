name: CI

on:
  push:
    # develop : ses vérifications valent pour la PR de livraison develop → main
    branches: [main, develop]
  pull_request:
    # ready_for_review : PR brouillon ouverte par le suivi des tickets, sans CI
    # encore (jeton des Actions) ; edited : base ou titre modifiés (une PR
    # reciblée ne reste pas sur l'échec de l'ancienne base)
    types: [opened, synchronize, reopened, edited, ready_for_review]
  # Lancé par le workflow de release sur sa PR (GITHUB_TOKEN ne déclenche que ce type)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck bin/* ci/*.sh ci/tickets/*.sh hooks/pre-commit hooks/prepare-commit-msg hooks/commit-msg hooks/pre-push hooks/post-checkout hooks/post-merge hooks/lib/*.sh hooks/lib/i18n/*.sh hooks/lang/*.sh install.sh

  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-tests
      - name: Tests
        env:
          BATS_TEST_TIMEOUT: "300" # une boucle infinie échoue au lieu de bloquer la CI
        run: bats --print-output-on-failure test/

  # Windows : créer un processus y coûte ~20-50 ms (émulation de fork par Git
  # Bash) contre ~1 ms ailleurs ; les tests sont donc répartis en parallèle.
  tests-windows:
    name: tests windows (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: branches, files: test/branches.bats test/test_names.bats test/install.bats test/npm.bats test/npm-publication.bats test/tickets.bats test/compat.bats test/ticket_cli.bats test/app.bats test/bot.bats test/bots.bats test/cli_help.bats test/garde.bats test/agents.bats }
          - { part: ci, files: test/ci_check.bats test/migrer.bats }
          - { part: messages, files: test/commit_messages.bats test/commit_assistant.bats }
          - { part: safety, files: test/safety.bats test/secrets.bats test/commentaires.bats }
          - { part: languages-1, files: test/languages.bats, filter: '^(detection|config|find_up|IaC|performance|python)' }
          - { part: languages-2, files: test/languages.bats, filter: '^(format|\.repowarden|pre-push)' }
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Machine jetable : l'analyse temps réel de Defender ralentit chaque création de fichier
      - name: Désactiver l'analyse temps réel de Defender
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-tests
      - name: Tests
        env:
          BATS_TEST_TIMEOUT: "300"
          FILES: ${{ matrix.files }}
          FILTER: ${{ matrix.filter }}
        run: |
          # shellcheck disable=SC2086 # liste de fichiers volontairement découpée
          if [ -n "$FILTER" ]; then
            bats --print-output-on-failure --filter "$FILTER" $FILES
          else
            bats --print-output-on-failure $FILES
          fi

  # Nom attendu par la protection de main : synthèse des parties Windows
  tests-windows-summary:
    name: tests (windows-latest)
    needs: tests-windows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.tests-windows.result }}
        run: |
          echo "Tests Windows : $RESULT"
          [ "$RESULT" = success ]

  # repowarden se vérifie avec sa propre action (dogfooding)
  repowarden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Aucun outil installé à la main : l'action doit se suffire à elle-même,
      # comme pour un projet utilisateur (actionlint, gitleaks)
      - uses: ./
        with:
          strict: true

  # Option MegaLinter de l'action, testée sur ce dépôt
  megalinter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./
        with:
          checks: commits
          megalinter: true
