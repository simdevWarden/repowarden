# Analyse de sécurité CodeQL des workflows GitHub Actions (injections, droits…)
name: codeql

on:
  push:
    # develop : ses vérifications valent pour la PR de livraison develop → main
    branches: [main, develop]
  pull_request:
  # Lancé par le workflow de release sur sa PR (analyse de chaque commit de main)
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
