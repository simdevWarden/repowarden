# Releases rythmées, sans jeton personnel ni fichier écrit : le travail
# s'intègre dans develop, où le job « release » (workflow réutilisable
# release-auto.yml en mode tag, le même que pour les projets) publie une
# préversion next et tient à jour la PR de livraison develop → main. La merger
# (décision humaine) pose sur main le tag vX.Y.Z et crée la release ; les jobs
# suivants déplacent le tag majeur, signent l'archive, attestent sa provenance,
# publient sur npm et republient la documentation.
name: release

on:
  push:
    # develop : PR de livraison tenue à jour ; main : release
    branches: [main, develop]
  schedule:
    # Préversion regroupée : chaque soir, si develop a changé
    - cron: "0 19 * * *"
    # Fenêtre de livraison : demande d'approbation le vendredi matin
    - cron: "0 7 * * 5"
  # À la main (et urgence) : préversion et demande de livraison
  workflow_dispatch:

# Une release à la fois par branche et par déclencheur : une demande de
# livraison en attente d'approbation ne bloque pas les merges suivants.
# Une nouvelle demande (manuelle, planifiée) remplace celle en attente, qui
# sinon bloquerait en silence les suivantes ; un push n'annule jamais un run
# en cours (GitHub ne garde qu'un run en attente par groupe : le suivant refait
# le même travail sur un état plus récent)
concurrency:
  group: release-${{ github.ref_name }}-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Aucun droit par défaut : chaque job déclare le strict nécessaire
permissions: {}

jobs:
  # Version, changelog, PR de release validée par la CI puis mergée, tag et
  # release : workflow réutilisable, le même que celui proposé aux projets
  release:
    uses: ./.github/workflows/release-auto.yml
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: write
      issues: read # notes de version : tickets livrés
    with:
      # Mode tag : le travail s'intègre dans develop (préversions next) ;
      # merger la PR de livraison develop → main publie le tag vX.Y.Z et la
      # release (version calculée depuis tous les commits livrés, aucun
      # fichier écrit). Un correctif urgent sur main revient seul dans develop.
      mode: tag
      integration-branch: develop
      # Livraison validée par « Approve and deploy » (environnement
      # production), puis mergée par la GitHub App
      delivery-environment: production
      delivery-schedule: "0 7 * * 5"
      app-client-id: ${{ vars.REPOWARDEN_APP_CLIENT_ID }}
      # CI lancée sur la PR de retour vers develop (docs.yml : site, exclu)
      workflows: ci.yml codeql.yml
      # repowarden s'utilise lui-même au commit publié, pas au tag v4
      repowarden-ref: ${{ github.sha }}
    secrets:
      app-key: ${{ secrets.REPOWARDEN_APP_KEY }}

  # Site republié après la release (notes de version de la page Changelog)
  docs:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Republier la documentation (changelog)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref main

  # Paquet npm (installation sur la machine : npm install -g), publié sans
  # jeton (publication de confiance). Activé par la variable REPOWARDEN_NPM ;
  # mise en place : bin/npm-publication. Le secret NPM_TOKEN ne sert qu'à la
  # toute première publication (vide ensuite : publication de confiance).
  npm:
    needs: release
    # Nouvelle release, ou lancement manuel du workflow : rattrape la dernière
    # release si elle n'est pas encore sur npm (sans effet sinon)
    if: vars.REPOWARDEN_NPM == 'true' && (needs.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/npm-publish.yml
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ needs.release.outputs.tag_name }}
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  # Préversion de test (develop) sur npm, étiquette « next » :
  # npm install -g repowarden@next
  npm-next:
    needs: release
    if: vars.REPOWARDEN_NPM == 'true' && needs.release.outputs.prerelease_created == 'true'
    uses: ./.github/workflows/npm-publish.yml
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ needs.release.outputs.prerelease_tag }}
      dist-tag: next

  # Tickets : en préprod à chaque préversion (commentaire), done et fermés à
  # chaque release, ou à une livraison sans nouvelle version
  tickets:
    needs: release
    if: needs.release.outputs.release_created == 'true' || needs.release.outputs.prerelease_created == 'true' || needs.release.outputs.delivered_without_version != ''
    uses: ./.github/workflows/tickets.yml
    permissions: { contents: write, issues: write, pull-requests: write, statuses: write }
    with:
      tag: ${{ needs.release.outputs.tag_name || needs.release.outputs.prerelease_tag }}
      delivered-sha: ${{ needs.release.outputs.delivered_without_version }}
      repowarden-repository: ${{ github.repository }}
      repowarden-ref: ${{ github.sha }}
      app-client-id: ${{ vars.REPOWARDEN_APP_CLIENT_ID }}
    secrets:
      app-key: ${{ secrets.REPOWARDEN_APP_KEY }}

  # Tag majeur flottant (v1 → dernière v1.x.y) pour `uses: …/repowarden@v1`
  tag-major:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Déplacer le tag majeur
        env:
          TAG: ${{ needs.release.outputs.tag_name }}
          MAJOR: v${{ needs.release.outputs.major }}
        run: |
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -f "$MAJOR" "$TAG"
          git push -f origin "refs/tags/$MAJOR"

  # Archive source signée (Sigstore, sans clé) jointe à la release :
  # vérifiable avec `cosign verify-blob` (voir SECURITY.md)
  sign:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      hashes: ${{ steps.archive.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Archive signée
        id: archive
        env:
          TAG: ${{ needs.release.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          name="repowarden-$TAG"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" "$TAG"
          cosign sign-blob --yes --bundle "$name.tar.gz.sigstore.json" "$name.tar.gz"
          gh release upload "$TAG" "$name.tar.gz" "$name.tar.gz.sigstore.json" --clobber
          # Empreinte de l'archive pour la preuve de provenance SLSA
          echo "hashes=$(sha256sum "$name.tar.gz" | base64 -w0)" >>"$GITHUB_OUTPUT"

  # Provenance SLSA niveau 3 : atteste que l'archive a été construite par ce
  # workflow, depuis ce dépôt et ce commit (fichier .intoto.jsonl joint à la
  # release). Générateur référencé par tag : exigé par l'outil, qui vérifie sa
  # propre identité.
  provenance:
    needs: [release, sign]
    if: needs.release.outputs.release_created == 'true'
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.sign.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.release.outputs.tag_name }}
      provenance-name: repowarden-${{ needs.release.outputs.tag_name }}.intoto.jsonl
