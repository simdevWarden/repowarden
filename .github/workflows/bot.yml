# Bot d'organisation (workflow réutilisable) : passage sur chaque projet où
# l'App du bot est installée (repowarden bot), rapport dans le résumé du run et
# dans l'issue « Rapport du bot repowarden » du dépôt de pilotage.
#
# Dans le dépôt de pilotage (repowarden bot init l'écrit) :
#   jobs:
#     bot:
#       uses: simdevWarden/repowarden/.github/workflows/bot.yml@v4
#       permissions: { contents: read, issues: write }
#       with:
#         app-client-id: ${{ vars.REPOWARDEN_BOT_CLIENT_ID }}
#       secrets:
#         app-key: ${{ secrets.REPOWARDEN_BOT_KEY }}
name: bot

on:
  workflow_call:
    inputs:
      app-client-id:
        description: "App du bot (repowarden app init --bot : vars.REPOWARDEN_BOT_CLIENT_ID)"
        type: string
        required: true
      dry-run:
        description: Voir ce qui serait fait (protection vérifiée, migration dans un clone jetable), sans rien modifier
        type: boolean
        default: false
      repowarden-ref:
        description: Version de repowarden dont les scripts sont utilisés
        type: string
        default: v4
      repowarden-repository:
        description: Dépôt d'où viennent les scripts
        type: string
        default: simdevWarden/repowarden
    secrets:
      app-key:
        description: Clé privée de l'App du bot (secrets.REPOWARDEN_BOT_KEY)
        required: true

permissions: {}

jobs:
  bot:
    # Seulement depuis la branche par défaut du dépôt de pilotage : la clé du
    # bot (administration) ne sert jamais à une branche de travail
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write # rapport : issue du dépôt de pilotage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repowarden-repository }}
          ref: ${{ inputs.repowarden-ref }}
          path: .repowarden-ci
          persist-credentials: false
      # Jeton d'installation pour tous les dépôts du propriétaire où l'App est installée
      - name: Jeton de l'App du bot
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-key }}
          owner: ${{ github.repository_owner }}
      - name: Identité du bot
        id: identite
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id="$(gh api "users/${SLUG}[bot]" --jq .id)"
          {
            echo "name=${SLUG}[bot]"
            echo "email=${id}+${SLUG}[bot]@users.noreply.github.com"
          } >>"$GITHUB_OUTPUT"
      - name: Passage
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOWARDEN_BOT_NAME: ${{ steps.identite.outputs.name }}
          REPOWARDEN_BOT_EMAIL: ${{ steps.identite.outputs.email }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          options=(--rapport rapport-bot.md)
          [ "$DRY_RUN" != true ] || options+=(--dry-run)
          bash .repowarden-ci/bin/bot "${options[@]}"
      - name: Rapport
        if: always() && hashFiles('rapport-bot.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .repowarden-ci/bin/bot rapport rapport-bot.md
