# Réglages repowarden de ce dépôt (appliqués aux hooks et à la CI)
[repowarden]
    # Cycle de livraison : le travail s'intègre dans develop, main ne reçoit
    # que les livraisons (PR develop → main) et les correctifs urgents (hotfix/*)
    integrationBranch = develop
    # Langue des textes du bot en CI (description des PR, commentaires des
    # tickets) : sans elle, la CI retombe sur l'anglais
    lang = fr
    protectedBranches = main develop
    # Vérifications exigées avant fusion sur develop et main (#590) : repowarden,
    # les tests Ubuntu et l'agrégat des parties Windows. macOS n'est pas exigé :
    # son job n'obtient parfois aucun runner (annulé après 15 min sans étape),
    # ce qui bloquerait toutes les PR ; il reste exécuté et visible.
    requiredChecks = repowarden,tests (ubuntu-latest),tests (windows-latest)
    # Branches longues, et branches de PR de release-please et Dependabot
    allowedBranches = main develop release-please--* dependabot/*
    # Projets exemples des tests e2e : volontairement mal formatés / cassés
    exclude = test/e2e/*
    # package.json ne sert qu'à publier le paquet npm : pas un projet Node
    skip = node
    # Commande « Mettre à jour » des notes de version
    releaseUpdate = npm update -g repowarden
