site_name: repowarden
site_description: Hooks git et CI multi-langages — messages de commit, nommage des branches, secrets, formatage, tests ciblés, releases.
site_url: https://simdevwarden.github.io/repowarden/
repo_url: https://github.com/simdevWarden/repowarden
repo_name: simdevWarden/repowarden
edit_uri: edit/main/docs/
copyright: Licence GPL-3.0-only

# Un lien cassé ou une page orpheline fait échouer la publication
strict: true

theme:
  name: material
  language: fr
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Mode clair
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link

nav:
  - Accueil: index.md
  - Pourquoi repowarden: pourquoi.md
  - Démarrage rapide: demarrage.md
  - Hooks et règles: hooks.md
  - Technologies: technologies.md
  - Configuration: configuration.md
  - CI (GitHub, GitLab): ci.md
  - Versions et releases: releases.md
  - Validation humaine: validation.md
  - Tickets: tickets.md
  - Code mort: code-mort.md
  - Carte du projet: carte.md
  - Agents IA: agents.md
  - En organisation: industrialisation.md
  - Désinstallation: desinstallation.md
  - Passer à la v4: migration-v4.md
  - Limites: limites.md
  - Sécurité: securite.md
  - Contribuer: contribuer.md
  - Changelog: changelog.md

# Site bilingue : page.md (français, par défaut) et page.en.md (anglais) ;
# une page sans traduction s'affiche en français dans la version anglaise
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
        - locale: en
          name: English
          build: true
          site_description: Multi-language git hooks and CI — commit messages, branch naming, secrets, formatting, targeted tests, releases.
          nav_translations:
            Accueil: Home
            Pourquoi repowarden: Why repowarden
            Passer à la v4: Moving to v4
            Démarrage rapide: Quick start
            Hooks et règles: Hooks and rules
            Technologies: Technologies
            Configuration: Configuration
            CI (GitHub, GitLab): CI (GitHub, GitLab)
            Versions et releases: Versions and releases
            Validation humaine: Human approval
            Code mort: Dead code
            Carte du projet: Project map
            Agents IA: AI agents
            En organisation: In an organisation
            Désinstallation: Uninstalling
            Limites: Limitations
            Sécurité: Security
            Contribuer: Contributing
            Changelog: Changelog

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  # Inclut SECURITY.md, CONTRIBUTING.md et CHANGELOG.md de la racine, sans copie
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

# Liens vers une section inexistante : bloquant (avec strict)
validation:
  links:
    anchors: warn

# Fichiers de docs/ non publiés
exclude_docs: |
  requirements.txt
  requirements.in
