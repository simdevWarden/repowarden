# Releases automatiques : à chaque merge sur main, la version (semver) est
# calculée depuis les Conventional Commits, une PR « release x.y.z » (changelog,
# version du projet) est validée par la CI puis mergée, et le tag vX.Y.Z et la
# release GitHub sont créés. Aucun jeton à créer.
#
# Prérequis : Settings → Actions → General → Workflow permissions →
# « Allow GitHub Actions to create and approve pull requests ».
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Une release à la fois
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    uses: simdevWarden/repowarden/.github/workflows/release-auto.yml@v4
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: write
    # Optionnel :
    # with:
    #   release-type: maven          # sinon détecté (pom.xml, package.json, pyproject.toml…)
    #   workflows: repowarden.yml     # sinon les workflows pull_request + workflow_dispatch
    #   merge-auto: false            # PR de release mergée par un humain
    # Optionnel : canal de l'équipe (gh secret set REPOWARDEN_WEBHOOK)
    # secrets:
    #   webhook: ${{ secrets.REPOWARDEN_WEBHOOK }}

  # Paquet npm à chaque release, sans jeton (mise en place : repowarden/bin/npm-publication) :
  # npm:
  #   needs: release
  #   if: vars.REPOWARDEN_NPM == 'true' && (needs.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
  #   uses: simdevWarden/repowarden/.github/workflows/npm-publish.yml@v4
  #   permissions: { contents: read, id-token: write }
  #   with:
  #     tag: ${{ needs.release.outputs.tag_name }}
  #   secrets:
  #     npm-token: ${{ secrets.NPM_TOKEN }} # première publication seulement

  # Tickets passés en préprod à chaque préversion, en done à chaque release
  # ou livraison sans nouvelle version
  # (mise en place : repowarden tickets init, voir la doc Tickets) :
  # tickets:
  #   needs: release
  #   if: needs.release.outputs.release_created == 'true' || needs.release.outputs.prerelease_created == 'true' || needs.release.outputs.delivered_without_version != ''
  #   uses: simdevWarden/repowarden/.github/workflows/tickets.yml@v4
  #   permissions: { issues: write, pull-requests: write, statuses: write }
  #   with:
  #     tag: ${{ needs.release.outputs.tag_name || needs.release.outputs.prerelease_tag }}
  #     delivered-sha: ${{ needs.release.outputs.delivered_without_version }}

  # Publication propre au projet, après une release (exemple). L'environnement
  # « production » (bin/proteger --environnement production) fait attendre
  # l'approbation d'une personne désignée avant de publier :
  # publier:
